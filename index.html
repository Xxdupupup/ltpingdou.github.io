<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MARD拼豆图纸生成器｜增强修复版</title>
<style>
:root {
  --brand-bg: #f7f1eb;
  --brand-card: #fffdfb;
  --brand-ink: #2e261f;
  --brand-accent: #c68b6a;
  --brand-accent-strong: #a86d4c;
  --brand-soft: #f3e4d6;
  --brand-line: #ead7c8;
  --brand-success: #7a9c75;
  --brand-success-dark: #5d7f5d;
  --brand-text-soft: #6a5a4f;
  --brand-shadow: rgba(90, 68, 55, 0.12);
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  max-width: 100%;
  margin: 0 auto;
  padding: 10px 10px 18px;
  background:
    radial-gradient(circle at top left, rgba(198, 139, 106, 0.12), transparent 28%),
    linear-gradient(180deg, #f9f4f0 0%, #f2f5f8 100%);
  color: var(--brand-ink);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

.brand-header {
  text-align: center;
  margin-bottom: 18px;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--brand-soft), #fff4ee);
  border: 1px solid var(--brand-line);
  color: var(--brand-accent-strong);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  box-shadow: 0 8px 18px rgba(168, 109, 76, 0.08);
}

h2 {
  text-align: center;
  margin: 10px 0 4px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--brand-ink);
  font-size: clamp(1.45rem, 5vw, 2.2rem);
}

.tip {
  color: var(--brand-text-soft);
  font-size: 13px;
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 0.04em;
}

.control-panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,250,247,0.96));
  padding: 12px 10px;
  border: 1px solid var(--brand-line);
  border-radius: 18px;
  box-shadow: 0 12px 28px var(--brand-shadow);
  margin-bottom: 14px;
  display: flex;
  gap:10px;
  flex-wrap: wrap;
  align-items: center;
}

.control-group {
  display:flex;
  align-items:center;
  gap:8px;
  min-height: 38px;
  padding: 5px 8px;
  border-radius: 12px;
  border: 1px solid rgba(234, 215, 200, 0.8);
  background: rgba(255,255,255,0.52);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
}

label {
  font-size:14px;
  color:#334155;
  white-space:nowrap;
}

input[type="number"] {
  width:84px;
  padding:6px 8px;
  border:1px solid #d7c7b8;
  border-radius:8px;
  background: #fffdfb;
  font-size:14px;
  -webkit-appearance: none;
  appearance: none;
  transition:border 0.2s, box-shadow 0.2s;
}
input[type="number"]:focus{
  outline:none;
  border-color:var(--brand-accent-strong);
  box-shadow:0 0 0 3px rgba(168,109,76,0.08);
}

input[type="file"]{
  font-size:14px;
  background: linear-gradient(180deg, #fffdfb, #fff7f2);
  border:1px solid #e6d5c7;
  border-radius:12px;
  padding: 10px 12px;
  color: var(--brand-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
  -webkit-appearance: none;
  appearance: none;
}

input[type="file"]::-webkit-file-upload-button {
  margin-right: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--brand-accent), var(--brand-accent-strong));
  color: #fff;
  font-weight: 700;
  padding: 8px 12px;
  cursor: pointer;
}

input[type="file"]::file-selector-button {
  margin-right: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--brand-accent), var(--brand-accent-strong));
  color: #fff;
  font-weight: 700;
  padding: 8px 12px;
  cursor: pointer;
}

input[type="checkbox"] {
  accent-color: var(--brand-accent-strong);
  width: 16px;
  height: 16px;
  margin: 0;
}

.btn {
  padding:9px 16px;
  border:none;
  border-radius:12px;
  font-size:14px;
  cursor:pointer;
  transition: all 0.2s ease;
  box-shadow: 0 6px 14px rgba(59, 49, 42, 0.08);
  -webkit-tap-highlight-color: transparent;
  position: relative;
}

.btn:disabled {
  opacity: 0.75;
  cursor: wait;
}

.btn.is-loading {
  padding-left: 38px;
}

.btn.is-loading::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 50%;
  width: 12px;
  height: 12px;
  margin-top: -6px;
  border: 2px solid rgba(255,255,255,0.45);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.btn-primary{
  background: linear-gradient(135deg, var(--brand-accent), var(--brand-accent-strong));
  color:#fff;
}
.btn-primary:hover{
  background: linear-gradient(135deg, var(--brand-accent-strong), var(--brand-accent));
}
.btn-success{
  background: linear-gradient(135deg, var(--brand-success), var(--brand-success-dark));
  color:#fff;
}
.btn-success:hover{
  background: linear-gradient(135deg, var(--brand-success-dark), var(--brand-success));
}
.btn-ghost{
  background:#f7f4f1;
  color:#4a3b33;
  border:1px solid var(--brand-line);
}
.btn-ghost:hover{
  background:#efe5dc;
}

.mobile-bottom-bar {
  position: -webkit-sticky;
  position: sticky;
  bottom: 0;
  z-index: 30;
  display: flex;
  gap: 8px;
  padding: 10px 8px 12px;
  margin-top: 12px;
  background: rgba(249, 244, 240, 0.96);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--brand-line);
}

@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .mobile-bottom-bar {
    background: rgba(249, 244, 240, 0.98);
  }
}

.mobile-bottom-bar .btn {
  flex: 1;
  min-height: 46px;
  font-weight: 700;
}

.wrap {
  display:flex;
  gap:24px;
  flex-wrap:wrap;
}

.panel {
  flex:1;
  min-width:340px;
}

.panel h4{
  margin:0 0 10px 0;
  font-weight:600;
  color:#1e293b;
}

.canvas-card {
  background: linear-gradient(180deg, #ffffff, #fffcfa);
  padding:16px;
  border-radius:16px;
  border:1px solid var(--brand-line);
  box-shadow:0 12px 26px rgba(59, 49, 42, 0.06);
  overflow:auto;
}

canvas {
  display:block;
  margin:0 auto;
  image-rendering:pixelated;
  border:1px solid #e8d7ca;
  border-radius:8px;
  background: linear-gradient(45deg, #f5f5f4 25%, transparent 25%), linear-gradient(-45deg, #f5f5f4 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f5f5f4 75%), linear-gradient(-45deg, transparent 75%, #f5f5f4 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
}

.stat-card{
  background: linear-gradient(180deg, #fffdfb, #fff8f3);
  padding:16px;
  border-radius:16px;
  border:1px solid var(--brand-line);
  box-shadow:0 12px 26px rgba(59, 49, 42, 0.06);
  margin-top:12px;
}

#stat {
  white-space:pre-wrap;
  font-family:Consolas,Monospace;
  font-size:13px;
  max-height:520px;
  overflow:auto;
  line-height:1.7;
  color:#334155;
}

.copy-bar{
  margin-bottom:10px;
  display:flex;
  gap:8px;
}

.warn-text{
  color:#dc2626;
  font-size:13px;
}

@media (max-width:768px){
  body {
    margin: 0;
    padding: 8px 8px 72px;
  }

  h2 {
    font-size: 1.4rem;
    line-height: 1.25;
    margin-top: 8px;
  }

  .tip {
    font-size: 11px;
    line-height: 1.5;
    padding: 0 6px;
    margin-bottom: 12px;
  }

  .control-panel{
    flex-direction:column;
    align-items:stretch;
    padding: 10px 8px;
    gap: 8px;
  }

  .control-group{
    justify-content:space-between;
    width: 100%;
    flex-wrap: nowrap;
    padding: 2px 2px;
  }

  .control-group label {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12px;
  }

  input[type="number"] {
    width: 76px;
    min-height: 34px;
    font-size: 16px;
  }

  input[type="file"] {
    width: 100%;
    min-height: 38px;
    font-size: 13px;
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
  }

  .btn {
    min-height: 40px;
    padding: 10px 14px;
    font-size: 14px;
    width: 100%;
  }

  .wrap {
    display:block;
  }

  .panel {
    min-width: 0;
    width: 100%;
    margin-bottom: 12px;
  }

  .panel h4 {
    font-size: 15px;
    margin-bottom: 8px;
  }

  .canvas-card, .stat-card {
    padding: 8px;
  }

  canvas {
    max-width: 100%;
    height: auto;
  }

  #stat {
    max-height: 300px;
    font-size: 11px;
  }

  .copy-bar {
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 8px;
  }

  .color-modal-content {
    min-width: 0 !important;
    width: min(94vw, 420px) !important;
    padding: 12px !important;
  }
}
</style>
</head>

<div class="control-panel">

    <label>拼豆宽度</label>
    <input id="sizeW" type="number" value="32"/>
  </div>
  <div class="control-group">
    <label>拼豆高度</label>
    <input id="sizeH" type="number" value="32"/>
  </div>
  <div class="control-group">
    <label>格子像素</label>
    <input id="beadPixel" type="number" value="14"/>
  </div>
<!-- 新增：前置图像降噪开关，放在enableDenoise旁边 -->
<div class="control-group">
    <input type="checkbox" id="preBlur" checked>
    <label for="preBlur">前置图像降噪(改善渐变杂色)</label>
</div>
  <div class="control-group">
    <label><input id="showCode" type="checkbox" checked/>格子显示色号</label>
  </div>
  <div class="control-group">
    <label><input id="showGrid" type="checkbox" checked/>绘制网格线</label>
  </div>
<div class="control-group" style="display:none;">
    <label><input id="highDpi" type="checkbox" checked/>2倍高清导出(打印)</label>
  </div>
<div class="control-group">
    <label><input id="enableDenoise" type="checkbox" checked/>3×3降噪平滑(后处理)</label>
</div>
<div class="control-group">
    <label><input id="mergeWhiteH01H02" type="checkbox"/>合并H01/H02白色</label>
</div>
<div class="control-group">
    <label><input id="ignoreWhiteBg" type="checkbox" checked/>忽略纯白背景</label>
</div>
<div class="control-group">
    <label><input id="autoDetectMain" type="checkbox" checked/>自动识别主图</label>
</div>
<div class="control-group">
    <label><input id="transparentBg" type="checkbox" checked/>透明背景</label>
</div>
  <button id="genBtn" class="btn btn-primary">生成图纸</button>
  <button id="downloadBtn" class="btn btn-success">导出PNG</button>
  <button id="openDisablePanelBtn" class="btn btn-ghost">禁用色</button>
</div>

<div class="mobile-bottom-bar">
  <button id="mobileGenBtn" class="btn btn-primary">生成</button>
  <button id="mobileDownloadBtn" class="btn btn-success">导出</button>
  <button id="mobileDisableBtn" class="btn btn-ghost">配色</button>
</div>

<div class="wrap">
  <div class="panel">
    <h4>图纸预览</h4>
    <div class="canvas-card">
      <canvas id="beadCanvas"></canvas>
    </div>
  </div>

  <div class="panel">
    <h4>色号&数量清单</h4>
    <div class="stat-card">
      <div class="copy-bar">
        <button id="copyBtn" class="btn btn-ghost">一键复制清单</button>
        <span id="warnArea" class="warn-text"></span>
      </div>
      <div id="stat"></div>
    </div>
  </div>
</div>

<div id="colorModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;align-items:center;justify-content:center;padding:16px;">
  <div class="color-modal-content" style="background:#fffdfb;padding:16px;border-radius:18px;min-width:320px;max-height:80vh;overflow:auto;border:1px solid #ead7c8;box-shadow:0 18px 36px rgba(72,54,47,0.12);">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;">
      <h4 style="margin:0;">禁用部分色号</h4>
      <button id="closeModalBtn" class="btn btn-ghost" style="min-width:34px;width:34px;height:34px;padding:0;border-radius:50%;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;">×</button>
    </div>
    <div id="colorCheckContainer" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;padding:8px;border:1px solid #f0e5df;border-radius:12px;background:#fffaf7;"></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button id="disableAllM" class="btn btn-ghost">全部禁用M系列</button>
      <button id="clearAllDisable" class="btn btn-ghost">清空禁用</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
      <button id="cancelModalBtn" class="btn btn-ghost">取消</button>
      <button id="confirmDisableBtn" class="btn btn-primary">确定</button>
    </div>
  </div>
</div>

function rgbToXyz(r,g,b){
  r/=255;g/=255;b/=255;
  r=r>0.04045?Math.pow((r+0.055)/1.055,2.4):r/12.92;
  g=g>0.04045?Math.pow((g+0.055)/1.055,2.4):g/12.92;
  b=b>0.04045?Math.pow((b+0.055)/1.055,2.4):b/12.92;
  return {x:r*100*0.4124+g*100*0.3576+b*100*0.1805,y:r*100*0.2127+g*100*0.7152+b*100*0.0722,z:r*100*0.0193+g*100*0.1192+b*100*0.9503};
}
function xyzToLab(xyz){
  const xn=95.047,yn=100,zn=108.883;
  let x=xyz.x/xn,y=xyz.y/yn,z=xyz.z/zn;
  const f=t=>t>0.008856?Math.pow(t,1/3):7.787*t+16/116;
  return {L:116*f(y)-16,a:500*(f(x)-f(y)),b:200*(f(y)-f(z))};
}
function rgb2lab(r,g,b){return xyzToLab(rgbToXyz(r,g,b));}

let colorCache=new Map();
function findNearestColor(r,g,b){
  const key=`${r},${g},${b}`;
  if(colorCache.has(key)) return colorCache.get(key);
  const labIn=rgb2lab(r,g,b);
  let minDist=Infinity,best=null;
  for(let c of MARD_COLORS){
    const labC=rgb2lab(c.r,c.g,c.b);
    const dL=labIn.L-labC.L,da=labIn.a-labC.a,db=labIn.b-labC.b;
    const dist=dL*dL+da*da+db*db;
    if(dist<minDist){minDist=dist;best=c;}
  }
  colorCache.set(key,best);
  return best;
}

function getContrastColor(r,g,b){
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.5?"#111":"#fff";
}

function naturalSortCode(a,b){
  const reg=/(\D+)|(\d+)/g;
  function token(s){
    return Array.from(s.matchAll(reg)).map(m=>isNaN(+m[2])?m[1]:+m[2]);
  }
  const ta=token(a),tb=token(b);
  for(let i=0;i<Math.max(ta.length,tb.length);i++){
    if(ta[i]==undefined)return -1;
    if(tb[i]==undefined)return 1;
    if(typeof ta[i]==="number"&&typeof tb[i]==="number"){
      if(ta[i]!==tb[i])return ta[i]-tb[i];
    }else{
      if(ta[i]<tb[i])return -1;
      if(ta[i]>tb[i])return 1;
    }
  }
  return 0;
}

/** sRGB转XYZ */
function rgb2xyz(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
    g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
    b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
    r *= 100; g *= 100; b *= 100;
    const x = r * 0.4124 + g * 0.3576 + b * 0.1805;
    const y = r * 0.2127 + g * 0.7152 + b * 0.0722;
    const z = r * 0.0193 + g * 0.1192 + b * 0.9503;
    return { x, y, z };
}

/** XYZ转LAB D65白点 */
function xyz2lab(x, y, z) {
    const xn = 95.047, yn = 100, zn = 108.883;
    x /= xn; y /= yn; z /= zn;
    const fn = (t) => t > 0.008856 ? Math.pow(t, 1/3) : (7.787 * t + 16 / 116);
    const fx = fn(x), fy = fn(y), fz = fn(z);
    const L = 116 * fy - 16;
    const a = 500 * (fx - fy);
    const b = 200 * (fy - fz);
    return { L, a, b };
}

/** RGB直接转LAB */
function rgb2lab(r,g,b){
    const xyz = rgb2xyz(r,g,b);
    return xyz2lab(xyz.x,xyz.y,xyz.z);
}

/** CIEDE2000 色差计算，返回ΔE，越小颜色越接近 */
function ciede2000(lab1, lab2) {
    const L1=lab1.L,a1=lab1.a,b1=lab1.b;
    const L2=lab2.L,a2=lab2.a,b2=lab2.b;

    const C1 = Math.sqrt(a1*a1 + b1*b1);
    const C2 = Math.sqrt(a2*a2 + b2*b2);
    const Cbar = (C1 + C2) / 2;
    const G = 0.5 * (1 - Math.sqrt(Math.pow(Cbar,7)/(Math.pow(Cbar,7)+Math.pow(25,7))));
    const a1p = a1 * (1 + G);
    const a2p = a2 * (1 + G);
    const C1p = Math.sqrt(a1p*a1p + b1*b1);
    const C2p = Math.sqrt(a2p*a2p + b2*b2);

    const h1p = (b1===0&&a1p===0)?0:Math.atan2(b1,a1p);
    const h2p = (b2===0&&a2p===0)?0:Math.atan2(b2,a2p);
    const h1pd = h1p < 0 ? h1p + 2*Math.PI : h1p;
    const h2pd = h2p < 0 ? h2p + 2*Math.PI : h2p;

    const dLp = L2 - L1;
    const dCp = C2p - C1p;

    let dhp;
    if(C1p===0||C2p===0){
        dhp = 0;
    }else{
        const hDiff = h2pd - h1pd;
        if(Math.abs(hDiff) <= Math.PI) dhp = hDiff;
        else if(hDiff > Math.PI) dhp = hDiff - 2*Math.PI;
        else dhp = hDiff + 2*Math.PI;
    }
    const dHp = 2*Math.sqrt(C1p*C2p)*Math.sin(dhp/2);

    const Lbarp = (L1+L2)/2;
    const Cbarp = (C1p + C2p)/2;

    let hbarp;
    if(C1p===0||C2p===0){
        hbarp = h1pd + h2pd;
    }else{
        if(Math.abs(h1pd - h2pd) <= Math.PI){
            hbarp = (h1pd + h2pd)/2;
        }else if(h1pd + h2pd < 2*Math.PI){
            hbarp = (h1pd + h2pd)/2 + Math.PI;
        }else{
            hbarp = (h1pd + h2pd)/2 - Math.PI;
        }
    }

    const T = 1
        - 0.17*Math.cos(hbarp - Math.PI/6)
        + 0.24*Math.cos(2*hbarp)
        + 0.32*Math.cos(3*hbarp + Math.PI/30)
        - 0.20*Math.cos(4*hbarp - 21*Math.PI/60);

    const dtheta = Math.PI/6 * Math.exp(-Math.pow((hbarp - 275*Math.PI/180)/(25*Math.PI/180),2));
    const RC = 2*Math.sqrt(Math.pow(Cbarp,7)/(Math.pow(Cbarp,7)+Math.pow(25,7)));
    const SL = 1 + (0.015 * Math.pow(Lbarp - 50,2)) / Math.sqrt(20 + Math.pow(Lbarp - 50,2));
    const SC = 1 + 0.045 * Cbarp;
    const SH = 1 + 0.015 * Cbarp * T;
    const RT = -Math.sin(2*dtheta)*RC;

    const dE00 = Math.sqrt(
        Math.pow(dLp/SL,2)
        + Math.pow(dCp/SC,2)
        + Math.pow(dHp/SH,2)
        + RT*(dCp/SC)*(dHp/SH)
    );
    return dE00;
}

    if(mardLabCache) return;
    mardLabCache = MARD_COLORS.map(c=>{

        return { ...c, lab };
    });
}

        wrap.appendChild(cb);
        wrap.appendChild(swatch);
        wrap.appendChild(label);
        colorCheckContainer.appendChild(wrap);
    })
}

// 【新版LAB‑CIEDE2000查找最近色号】替换原来RGB距离
function findNearestColor(r,g,b){
    buildMardLabCache();
    let targetList = mardLabCache.filter(item=>!disabledCodeSet.has(item.code));
    if(mergeWhiteH01H02.checked){
        targetList = targetList.filter(x=>x.code!=='H02');
    }
    const pixelLab = rgb2lab(r,g,b);
    let minDeltaE = Infinity;
    let best = null;
    for(const c of targetList){
        const de = ciede2000(pixelLab, c.lab);
        if(de < minDeltaE){
            minDeltaE = de;
            best = c;
        }
    }
    return best;
}

// 3*3降噪平滑（原有后处理降噪保留，作为二次兜底）
function denoise(grid,W,H){
    const out = JSON.parse(JSON.stringify(grid));
    for(let y=1;y<H-1;y++){
        for(let x=1;x<W-1;x++){
            const center = grid[y][x];
            const near = [];
            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){
                    near.push(grid[y+dy][x+dx]);
                }
            }
            //统计出现最多色
            const cnt = {};
            near.forEach(p=>{
                const k = p? p.code:'null';
                cnt[k] = (cnt[k]||0)+1;
            })
            let maxCount=0;
            let mostKey=null;
            for(let k in cnt){
                if(cnt[k]>maxCount){
                    maxCount=cnt[k];
                    mostKey=k;
                }
            }
            if(maxCount>=6 && mostKey!=='null'){
                if(center && center.code!==mostKey){
                    const rep = near.find(n=>n&&n.code===mostKey);
                    out[y][x] = rep;
                }
            }
        }
    }
    return out;
}

function isNearWhite(r,g,b, tolerance=18) {
    return r >= 255 - tolerance && g >= 255 - tolerance && b >= 255 - tolerance;
}

function isNearGray(r,g,b, tolerance=18) {
    const diff = Math.max(Math.abs(r-g), Math.abs(g-b), Math.abs(r-b));
    return diff <= tolerance;
}

function isSmoothWhiteNeighborhood(data, width, height, x, y) {
    let whiteCount = 0;
    let total = 0;
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx;
            const ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
            total++;
            const idx = (ny * width + nx) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];
            if (a < 8) continue;
            const brightness = (r * 0.299 + g * 0.587 + b * 0.114);
            if (brightness > 230 && Math.abs(r - g) <= 18 && Math.abs(g - b) <= 18) {
                whiteCount++;
            }
        }
    }
    return total > 0 && whiteCount / total > 0.7;
}

function isLikelyBackgroundPixel(r,g,b,a=255) {
    if (a < 10) return true;
    const brightness = (r * 0.299 + g * 0.587 + b * 0.114);
    const nearWhite = isNearWhite(r,g,b, 20) && brightness > 235;
    const subtleGray = isNearGray(r,g,b, 18) && brightness > 220;
    return nearWhite || subtleGray;
}

function buildWhiteBackgroundMask(data, width, height) {
    const mask = new Uint8Array(width * height);
    const borderBand = 4;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const isNearBorder = x <= borderBand || y <= borderBand || x >= width - borderBand - 1 || y >= height - borderBand - 1;
            if (!isNearBorder) continue;

            const idx = (y * width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];
            if (a < 8) {
                mask[y * width + x] = 1;
                continue;
            }
            if (isLikelyBackgroundPixel(r, g, b, a) && isSmoothWhiteNeighborhood(data, width, height, x, y)) {
                mask[y * width + x] = 1;
            }
        }
    }

    return mask;
}

function detectMainSubjectBackground(img) {
    if (!img || !img.width || !img.height) return { isWhiteBackground: false, isTransparent: false };

    const sampleCanvas = document.createElement('canvas');
    const sampleW = Math.min(120, img.width);
    const sampleH = Math.min(120, img.height);
    sampleCanvas.width = sampleW;
    sampleCanvas.height = sampleH;
    const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
    sctx.clearRect(0, 0, sampleW, sampleH);
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(img, 0, 0, sampleW, sampleH);

    const { data } = sctx.getImageData(0, 0, sampleW, sampleH);
    let whiteBorder = 0;
    let totalBorder = 0;
    let alphaHits = 0;
    let totalPixels = 0;

    for (let y = 0; y < sampleH; y++) {
        for (let x = 0; x < sampleW; x++) {
            const idx = (y * sampleW + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];
            totalPixels++;
            if (a < 10) {
                alphaHits++;
                continue;
            }
            if (x <= 2 || y <= 2 || x >= sampleW - 3 || y >= sampleH - 3) {
                totalBorder++;
                if (isLikelyBackgroundPixel(r, g, b, a)) {
                    whiteBorder++;
                }
            }
        }
    }

    const borderRatio = totalBorder === 0 ? 0 : whiteBorder / totalBorder;
    const transparentRatio = totalPixels === 0 ? 0 : alphaHits / totalPixels;
    const isWhiteBackground = borderRatio > 0.65 && transparentRatio < 0.25;
    return {
        isWhiteBackground,
        isTransparent: transparentRatio > 0.15 || isWhiteBackground
    };
}

function shouldTreatAsBackground(r, g, b, a = 255, bgMode = 'auto') {
    if (a < 8) return true;
    if (bgMode === 'transparent') return false;
    const useAutoDetect = autoDetectMain && autoDetectMain.checked;
    if (useAutoDetect) {
        return isLikelyBackgroundPixel(r, g, b, a);
    }
    return ignoreWhiteBg.checked && isLikelyBackgroundPixel(r, g, b, a);
}

async function triggerGenerate(){
    if(!imgObj){
        warnArea.textContent="请先选择图片文件";
        return;
    }

    setGenerateLoading(true);
    warnArea.textContent='';

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 120));
    });

    try {
        const w = Number(sizeW.value)||32;
        const h = Number(sizeH.value)||32;
        const autoBg = detectMainSubjectBackground(imgObj);
        const shouldIgnoreWhite = (autoDetectMain.checked && autoBg.isWhiteBackground) || ignoreWhiteBg.checked;

        // 临时画布缩放到目标尺寸
        const tempCvs = document.createElement('canvas');
        tempCvs.width = w;
        tempCvs.height = h;
        const tctx = tempCvs.getContext('2d', { willReadFrequently: true });
        tctx.imageSmoothingEnabled = false;
        tctx.imageSmoothingQuality = 'low';
        tctx.drawImage(imgObj,0,0,w,h);

        // 新增：前置图像高斯模糊，在取像素之前抑制原图噪点，解决渐变跳豆
        if(preBlur && preBlur.checked){
            tctx.filter = 'blur(0.6px)';
            tctx.drawImage(tempCvs,0,0);
            tctx.filter = 'none';
        }

        const imgData = tctx.getImageData(0,0,w,h);
        const data = imgData.data;
        const backgroundMask = shouldIgnoreWhite ? buildWhiteBackgroundMask(data, w, h) : new Uint8Array(w * h);

        //构建网格
        let grid = [];
        for(let y=0;y<h;y++){
            const row = [];
            for(let x=0;x<w;x++){
                const idx = (y*w+x)*4;
                const r = data[idx];
                const g = data[idx+1];
                const b = data[idx+2];
                const a = data[idx+3];
                const isBackground = shouldIgnoreWhite && backgroundMask[y * w + x] === 1;
                if (isBackground || a <= 8) {
                    row.push(null);
                } else {
                    const c = findNearestColor(r,g,b);
                    row.push(c);
                }
            }
            grid.push(row);
        }

        if(enableDenoise.checked){
            grid = denoise(grid,w,h);
        }
        lastGrid = grid;

        //绘制画布
        const px = Number(beadPixel.value)||14;
        canvas.width = w*px;
        canvas.height = h*px;
        canvas.style.width = '';
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.imageSmoothingQuality = 'low';
        const useTransparentBackground = transparentBg.checked;

        //画拼豆方块
        for(let y=0;y<h;y++){
            for(let x=0;x<w;x++){
                const cell = grid[y][x];
                ctx.save();
                if(cell){
                    ctx.fillStyle = `rgb(${cell.r},${cell.g},${cell.b})`;
                }else if(useTransparentBackground){
                    ctx.clearRect(x*px, y*px, px, px);
                }else{
                    ctx.fillStyle = '#ffffff';
                }
                if(cell || !useTransparentBackground){
                    ctx.fillRect(x*px,y*px,px,px);
                }

                //网格线
                if(showGrid.checked){
                    ctx.strokeStyle='#cccccc';
                    ctx.lineWidth=0.5;
                    ctx.strokeRect(x*px,y*px,px,px);
                }

                //色号文字
                if(showCode.checked && cell){
                    ctx.fillStyle = ((cell.r*0.299 + cell.g*0.587 + cell.b*0.114)>160)?'#222222':'#ffffff';
                    ctx.font = `${Math.max(7,px*0.42)}px Consolas`;
                    ctx.textAlign='center';
                    ctx.textBaseline='middle';
                    ctx.fillText(cell.code, x*px+px/2, y*px+px/2);
                }
                ctx.restore();
            }
        }

        fitCanvasToViewport();

        //统计清单
        const countMap = {};
        for(let y=0;y<h;y++){
            for(let x=0;x<w;x++){
                const c = grid[y][x];
                if(!c) continue;
                countMap[c.code] = (countMap[c.code]||0)+1;
            }
        }
        let statText = `图纸尺寸：宽${w} × 高${h}\n\n【色号清单｜数量】\n`;
        let totalBead =0;
        for(const code of Object.keys(countMap).sort()){
            const num = countMap[code];
            totalBead += num;
            const info = MARD_COLORS.find(x=>x.code===code);
            statText += `${code} ${info?.name||''} : ${num}颗\n`;
        }
        statText +=`\n合计使用拼豆：${totalBead}颗`;
        statDom.innerText = statText;
    } finally {
        setGenerateLoading(false);
    }
}

downloadBtn.onclick = function(){
    if(!lastGrid){
        alert("请先生成图纸");
        return;
    }
    const w = Number(sizeW.value);
    const h = Number(sizeH.value);
    const px = Number(beadPixel.value);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const scale = highDpi.checked ? (isIOS ? Math.min(window.devicePixelRatio || 1, 2) : 2) : 1;

    const countMap = {};
    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            const c = lastGrid[y][x];
            if(!c) continue;
            countMap[c.code] = (countMap[c.code]||0)+1;
        }
    }

    const legendLines = Object.keys(countMap).sort().map(code => {
        const info = MARD_COLORS.find(x => x.code === code);
        return { code, name: info?.name || '', count: countMap[code] };
    });

    const legendGap = 8;
    const legendPaddingX = 12;
    const availableContentWidth = Math.max(120, w * px - 24);
    const minCellWidth = 80;
    const maxColumns = Math.max(
        2,
        Math.min(
            12,
            Math.floor((availableContentWidth + legendGap) / (minCellWidth + legendGap))
        )
    );
    const legendColumns = Math.min(
        Math.max(2, Math.ceil(Math.sqrt(legendLines.length * 1.5))),
        Math.max(2, maxColumns),
        Math.max(2, legendLines.length)
    );
    const cellWidth = (availableContentWidth - legendPaddingX * 2 - legendGap * (legendColumns - 1)) / legendColumns;
    const legendItemHeight = 20;
    const legendRows = Math.ceil(legendLines.length / legendColumns);
    const legendBlockHeight = 36 + legendRows * (legendItemHeight + 10) + 10;
    const expCvs = document.createElement('canvas');
    expCvs.width = Math.max(1, Math.round(w * px * scale));
    expCvs.height = Math.max(1, Math.round((h * px + legendBlockHeight + 12) * scale));
    const ectx = expCvs.getContext('2d');
    ectx.setTransform(1, 0, 0, 1, 0, 0);
    ectx.clearRect(0, 0, expCvs.width, expCvs.height);
    ectx.scale(scale, scale);
    ectx.imageSmoothingEnabled = false;
    ectx.webkitImageSmoothingEnabled = false;
    ectx.imageSmoothingQuality = 'low';

    if (!transparentBg.checked) {
        ectx.fillStyle = '#ffffff';
        ectx.fillRect(0, 0, w * px, h * px + legendBlockHeight + 12);
    }

    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            const cell = lastGrid[y][x];
            ectx.save();
            if(cell){
                ectx.fillStyle = `rgb(${cell.r},${cell.g},${cell.b})`;
                ectx.fillRect(x*px,y*px,px,px);
            } else if (!transparentBg.checked) {
                ectx.fillStyle='#ffffff';
                ectx.fillRect(x*px,y*px,px,px);
            }
            if(showGrid.checked){
                ectx.strokeStyle='#cccccc';
                ectx.lineWidth=0.5;
                ectx.strokeRect(x*px,y*px,px,px);
            }
            if(showCode.checked && cell){
                ectx.fillStyle = ((cell.r*0.299 + cell.g*0.587 + cell.b*0.114)>160)?'#222222':'#ffffff';
                const textPx = Math.max(6, Math.min(10, Math.floor(px * 0.42)));
                ectx.font = `${textPx}px "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif`;
                ectx.textAlign='center';
                ectx.textBaseline='middle';
                ectx.fillText(cell.code, x*px+px/2, y*px+px/2);
            }
            ectx.restore();
        }
    }

    // 图例背景
    const legendTop = h * px + 10;
    const legendLeft = 8;
    const legendWidth = Math.max(100, w * px - 16);
    ectx.fillStyle = '#fffdfb';
    ectx.fillRect(legendLeft, legendTop, legendWidth, legendBlockHeight);
    ectx.strokeStyle = '#ead7c8';
    ectx.lineWidth = 1;
    ectx.strokeRect(legendLeft, legendTop, legendWidth, legendBlockHeight);

    ectx.fillStyle = '#5d4a3f';
    ectx.font = 'bold 15px "SF Pro Display", "PingFang SC", sans-serif';
    ectx.textAlign = 'left';
    ectx.fillText('颜色图例', legendLeft + 12, legendTop + 18);

    const startX = legendLeft + legendPaddingX;
    const legendY = legendTop + 30;

    legendLines.forEach((item, index) => {
        const rowIndex = Math.floor(index / legendColumns);
        const colIndex = index % legendColumns;
        const itemX = startX + colIndex * (cellWidth + legendGap);
        const itemY = legendY + rowIndex * (legendItemHeight + 8);
        const swatchX = itemX + 2;
        const swatchY = itemY + 2;
        const swatchW = 16;
        const swatchH = 16;
        const color = MARD_COLORS.find(x => x.code === item.code) || { r: 255, g: 255, b: 255 };

        ectx.fillStyle = '#f5efe9';
        ectx.fillRect(itemX, itemY, cellWidth, legendItemHeight);

        ectx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
        ectx.fillRect(swatchX, swatchY, swatchW, swatchH);
        ectx.strokeStyle = '#d8c5b7';
        ectx.strokeRect(swatchX, swatchY, swatchW, swatchH);

        ectx.fillStyle = '#334155';
        ectx.font = '12px "SF Pro Display", "PingFang SC", sans-serif';
        ectx.textAlign = 'left';
        ectx.fillText(`${item.code}`, swatchX + 22, swatchY + 11);

        ectx.fillStyle = '#6b7280';
        ectx.textAlign = 'right';
        ectx.fillText(`×${item.count}`, itemX + cellWidth - 6, swatchY + 11);
        ectx.textAlign = 'left';
    });

    const filename = `mard拼豆图纸_${w}x${h}.png`;

    const triggerDownload = (url) => {
        const link = document.createElement('a');
        link.download = filename;
        link.href = url;
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
    };

    if (expCvs.toBlob) {
        expCvs.toBlob((blob) => {
            if (!blob) {
                triggerDownload(expCvs.toDataURL('image/png'));
                return;
            }
            const objectUrl = URL.createObjectURL(blob);
            triggerDownload(objectUrl);
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1200);
        }, 'image/png');
        return;
    }

    triggerDownload(expCvs.toDataURL('image/png'));
}
